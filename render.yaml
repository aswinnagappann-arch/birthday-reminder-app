services:
  - type: web
    name: birthday-reminder-app
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: REMINDER_HOUR
        value: 9
      - key: REMINDER_MINUTE
        value: 0
